<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زمردة | لوحة الإدارة</title><link rel="stylesheet" href="css/admin.css"></head>
<body>
<header class="admin-head"><a href="index.html">← العودة للمتجر</a><div><b>زمردة</b><small>لوحة إدارة المنتجات</small></div></header>
<main class="admin-shell">
<section class="admin-intro"><div><span>LOCAL ADMIN</span><h1>إدارة المنتجات</h1><p>هذه لوحة تجريبية تعتمد على LocalStorage في نفس المتصفح. ليست نظام إدارة مؤمّناً للإنتاج.</p></div><div class="stats"><strong id="productCount">0</strong><span>منتج</span></div></section>
<section class="admin-grid">
<div class="panel">
<h2 id="formTitle">إضافة منتج</h2>
<form id="productForm">
<input type="hidden" name="id">
<label>اسم المنتج<input name="name" required></label>
<div class="two"><label>التصنيف<select name="category"><option value="makeup">مكياج</option><option value="care">عناية</option><option value="perfume">عطور</option><option value="accessories">إكسسوارات</option><option value="gifts">هدايا</option><option value="boxes">بوكسات</option><option value="offers">عروض</option></select></label><label>السعر<input name="price" type="number" min="0" required></label></div>
<label>رابط الصورة<input name="image" type="url" required></label>
<label>الشارة<input name="tag" placeholder="جديد / الأكثر طلباً"></label>
<div class="two"><label>الميزانية<select name="budget"><option value="low">اقتصادية</option><option value="medium">متوسطة</option><option value="premium">مميزة</option></select></label><label>المعرّف الإنجليزي<input name="id" id="idInput" placeholder="rose-box"></label></div>
<div class="actions"><button class="primary" type="submit">حفظ المنتج</button><button type="button" id="cancelEdit">إلغاء</button></div>
</form>
</div>
<div class="panel"><div class="panel-title"><h2>المنتجات الحالية</h2><button id="restoreBtn">استعادة التجريبي</button></div><div id="adminProducts"></div></div>
</section>
</main><script src="js/products.js"></script><script src="js/admin.js"></script>
</body></html>
